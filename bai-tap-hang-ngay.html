<script>
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const sh=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const F=(x,d=0)=>String(+(+x).toFixed(d)).replace('.',',');
const H=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const R=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(r,q,c,w,e)=>{const o=sh(r,[c,...w]);return{q,o,a:o.indexOf(c),e}};
const OP=(r,c,s,d,u)=>{if(typeof c=='string')return{c,w:s};const w=[];for(const k of sh(r,[1,-1,2,-2,3,-3,10,-10,11,12])){const v=+(c+k*s).toFixed(d+2);if(v>0&&v!==c&&!w.includes(v))w.push(v);if(w.length==3)break}return{c:F(c,d)+u,w:w.map(v=>F(v,d)+u)}};
/* ===== TOÁN: sinh đề theo ngày. Mỗi mục: [đề, đáp án, bước nhảy/ds đáp án sai, số lẻ, đơn vị, lời giải] ===== */
const M={3:[[
r=>{const a=ri(r,4,9),b=ri(r,3,9),c=ri(r,2,10),x=a*b;return[`Mỗi hộp có ${a} cái bút. Lan mua ${b} hộp, rồi tặng bạn ${c} cái. Hỏi Lan còn lại bao nhiêu cái bút?`,x-c,1,0,' cái',`Số bút Lan mua: ${a} × ${b} = ${x} (cái). Số bút còn lại: ${x} − ${c} = ${x-c} (cái).`]},
r=>{const a=ri(r,20,90),b=ri(r,3,9),c=ri(r,3,9),d=ri(r,5,19),m=b*c;return[`Giá trị của biểu thức ${a} + ${b} × ${c} − ${d} là:`,a+m-d,1,0,'',`Nhân trước, cộng trừ sau: ${b} × ${c} = ${m}; ${a} + ${m} = ${a+m}; ${a+m} − ${d} = ${a+m-d}.`]},
r=>{const b=ri(r,3,9),q=ri(r,12,60),k=ri(r,1,b-1),x=q*b+k;return[`Một số chia cho ${b} được thương là ${q} và số dư là ${k}. Số đó là:`,x,1,0,'',`Số bị chia = thương × số chia + số dư = ${q} × ${b} + ${k} = ${x}.`]},
r=>{const a=ri(r,12,60),b=ri(r,5,a-1),p=(a+b)*2;return[`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Chu vi hình chữ nhật là:`,p,2,0,' cm',`Chu vi = (dài + rộng) × 2 = (${a} + ${b}) × 2 = ${p} (cm).`]}],[
r=>{const a=ri(r,101,399),b=ri(r,2,5);return[`Tính: ${a} × ${b} = ?`,a*b,10,0,'',`${a} × ${b} = ${a*b}.`]},
r=>{const s=r()<.5,a=ri(r,3400,8000),b=ri(r,1100,3300);return[`Tính: ${a} ${s?'+':'−'} ${b} = ?`,s?a+b:a-b,10,0,'',`${a} ${s?'+':'−'} ${b} = ${s?a+b:a-b}.`]},
r=>{const b=ri(r,2,9),q=ri(r,50,150);return[`Tính: ${q*b} : ${b} = ?`,q,1,0,'',`${q*b} : ${b} = ${q} (vì ${q} × ${b} = ${q*b}).`]},
r=>{const a=ri(r,6,25),b=ri(r,3,8);return[`Nam có ${a} viên bi. Số bi của Bình gấp ${b} lần số bi của Nam. Bình có bao nhiêu viên bi?`,a*b,a,0,' viên',`Gấp lên ${b} lần thì nhân với ${b}: ${a} × ${b} = ${a*b} (viên bi).`]}],[
r=>{const a=ri(r,2,9),b=ri(r,2,9);return[`${a} × ${b} = ?`,a*b,a,0,'',`${a} × ${b} = ${a*b} (bảng nhân ${a}).`]},
r=>{const a=ri(r,2,9),b=ri(r,2,9);return[`${a*b} : ${a} = ?`,b,1,0,'',`${a*b} : ${a} = ${b} (vì ${a} × ${b} = ${a*b}).`]},
r=>{const s=r()<.5,a=ri(r,35,99),b=ri(r,11,34);return[`Tính: ${a} ${s?'+':'−'} ${b} = ?`,s?a+b:a-b,10,0,'',`${a} ${s?'+':'−'} ${b} = ${s?a+b:a-b}.`]},
r=>{const n=ri(r,1000,9998);return[`Số liền sau của ${n} là:`,n+1,1,0,'',`Số liền sau hơn số đó 1 đơn vị: ${n} + 1 = ${n+1}.`]}]],
5:[[
r=>{const v=ri(r,18,30)*2,t=ri(r,1,4)+.5,s=v*t;return[`Một ô tô đi với vận tốc ${v} km/giờ trong ${F(t,1)} giờ. Quãng đường ô tô đi được là:`,s,10,0,' km',`Quãng đường = vận tốc × thời gian = ${v} × ${F(t,1)} = ${s} (km).`]},
r=>{const m=ri(r,3,12),N=20*m,k=ri(r,2,8),p=5*k,sd=m*k;return[`Cửa hàng có ${N} kg gạo, đã bán ${p}% số gạo đó. Số gạo còn lại là:`,N-sd,5,0,' kg',`Số gạo đã bán: ${N} × ${p} : 100 = ${sd} (kg). Số gạo còn lại: ${N} − ${sd} = ${N-sd} (kg).`]},
r=>{const a=ri(r,4,20)*2,h=ri(r,3,15),s=a*h/2;return[`Hình tam giác có đáy ${a} cm và chiều cao ${h} cm. Diện tích hình tam giác là:`,s,2,0,' cm²',`Diện tích = đáy × chiều cao : 2 = ${a} × ${h} : 2 = ${s} (cm²).`]},
r=>{const k=ri(r,6,40),S=5*k;return[`Tổng của hai số là ${S}. Số bé bằng 2/3 số lớn. Số lớn là:`,3*k,k,0,'',`Số bé là 2 phần, số lớn là 3 phần nên tổng là 5 phần. Mỗi phần: ${S} : 5 = ${k}. Số lớn: ${k} × 3 = ${3*k}.`]}],[
r=>{const s=r()<.5,a=s?ri(r,100,999)/100:ri(r,300,999)/100,b=s?ri(r,100,500)/100:ri(r,100,299)/100,c=s?a+b:a-b;return[`Tính: ${F(a,2)} ${s?'+':'−'} ${F(b,2)} = ?`,c,.1,2,'',`${F(a,2)} ${s?'+':'−'} ${F(b,2)} = ${F(c,2)}.`]},
r=>{const x=ri(r,12,95)/10,y=ri(r,2,9),c=Math.round(x*10*y)/10;return[`Tính: ${F(x,1)} × ${y} = ?`,c,.1,1,'',`${F(x,1)} × ${y} = ${F(c,1)}.`]},
r=>{const n=ri(r,2,9),qt=ri(r,11,99),x=qt*n/10;return[`Tính: ${F(x,1)} : ${n} = ?`,qt/10,.1,1,'',`${F(x,1)} : ${n} = ${F(qt/10,1)}.`]},
r=>{if(r()<.5){const h=ri(r,1,5)+.5;return[`${F(h,1)} giờ = ... phút`,h*60,30,0,' phút',`1 giờ = 60 phút nên ${F(h,1)} × 60 = ${h*60} (phút).`]}const k=ri(r,12,99)/10;return[`${F(k,1)} km = ... m`,Math.round(k*1000),100,0,' m',`1 km = 1000 m nên ${F(k,1)} × 1000 = ${Math.round(k*1000)} (m).`]}],[
r=>{const p=sh(r,[10,20,25,50])[0],N=20*ri(r,2,15),c=N*p/100;return[`${p}% của ${N} là:`,c,2,0,'',`${p}% của ${N} = ${N} × ${p} : 100 = ${c}.`]},
r=>{const a=ri(r,5,40);return[`Hình vuông có cạnh ${a} cm. Chu vi hình vuông là:`,a*4,a,0,' cm',`Chu vi hình vuông = cạnh × 4 = ${a} × 4 = ${a*4} (cm).`]},
r=>{const a=ri(r,8,40),b=ri(r,4,a-1);return[`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Diện tích hình chữ nhật là:`,a*b,b,0,' cm²',`Diện tích = dài × rộng = ${a} × ${b} = ${a*b} (cm²).`]},
r=>{const d=ri(r,5,15),a=ri(r,1,4),b=ri(r,1,4);return[`Tính: ${a}/${d} + ${b}/${d} = ?`,`${a+b}/${d}`,[`${a+b}/${2*d}`,`${a+b+1}/${d}`,`${a+b-1}/${d}`],0,'',`Hai phân số cùng mẫu số: cộng tử số, giữ nguyên mẫu số. ${a} + ${b} = ${a+b}, nên kết quả là ${a+b}/${d}.`]}]]};
function math(r,g,i){const L=M[g][i<3?0:i<6?1:2],[q,c,s,d,u,e]=L[ri(r,0,L.length-1)](r),o=OP(r,c,s,d,u);return mk(r,q,o.c,o.w,e)}
/* ===== TIẾNG VIỆT & TIẾNG ANH: kho câu hỏi, mỗi ngày bốc ngẫu nhiên theo ngày, xếp từ khó đến dễ ===== */
const V3=[['cat','con mèo'],['dog','con chó'],['red','màu đỏ'],['book','quyển sách'],['apple','quả táo'],['mother','mẹ'],['school','trường học'],['teacher','giáo viên'],['window','cửa sổ'],['bicycle','xe đạp'],['bedroom','phòng ngủ'],['library','thư viện']];

const D={vi:{3:[
{q:'Từ trái nghĩa với “{0}” là:',e:'“{0}” trái nghĩa với “{1}”.',d:[['to','nhỏ'],['nóng','lạnh'],['sáng','tối'],['cao','thấp'],['nhanh','chậm'],['vui','buồn'],['khen','chê'],['siêng năng','lười biếng'],['rộng rãi','chật hẹp'],['hiền lành','độc ác'],['dũng cảm','hèn nhát'],['trung thực','dối trá']]},
{q:'Từ đồng nghĩa với “{0}” là:',e:'“{0}” đồng nghĩa với “{1}”.',d:[['mẹ','má'],['heo','lợn'],['bắp','ngô'],['chăm chỉ','cần cù'],['to lớn','khổng lồ'],['xinh đẹp','xinh xắn'],['dũng cảm','can đảm'],['tổ quốc','đất nước']]},
{q:'Điền từ còn thiếu: {0}',e:'Câu đúng: “{0}”.',d:[['Uống nước nhớ ___','nguồn'],['Ăn quả nhớ kẻ trồng ___','cây'],['Có công mài sắt, có ngày nên ___','kim'],['Lá lành đùm lá ___','rách'],['Học thầy không tày học ___','bạn'],['Gần mực thì đen, gần đèn thì ___','sáng'],['Chị ngã em ___','nâng'],['Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi ___','cao']]},

5:[
{q:'Từ đồng nghĩa với “{0}” là:',e:'“{0}” đồng nghĩa với “{1}”.',d:[['tổ quốc','đất nước'],['bao la','mênh mông'],['bình minh','rạng đông'],['gan dạ','dũng cảm'],['hi vọng','mong ước'],['thâm thúy','sâu sắc']]},
{q:'Từ trái nghĩa với “{0}” là:',e:'“{0}” trái nghĩa với “{1}”.',d:[['hòa bình','chiến tranh'],['đoàn kết','chia rẽ'],['tiết kiệm','lãng phí'],['khiêm tốn','kiêu căng'],['cao thượng','hèn hạ'],['gian dối','trung thực']]},
{q:'Từ nào dưới đây là từ láy?',e:'“{1}” là từ láy (có tiếng lặp lại âm hoặc vần); các từ còn lại là từ ghép.',w:['học sinh','bàn ghế','xe đạp','nhà cửa','quần áo','đất nước'],d:['lấp lánh','xinh xắn','mênh mông','long lanh','rì rào','thập thò']},
{q:'Điền từ còn thiếu: {0}',e:'Câu đúng: “{0}”.',d:[['Có chí thì ___','nên'],['Anh em như thể tay ___','chân'],['Thương người như thể thương ___','thân'],['Nước chảy đá ___','mòn'],['Đoàn kết là sức ___','mạnh'],['Tốt gỗ hơn tốt ___','nước sơn']]}]},
en:{3:[

{q:'Từ tiếng Anh của “{0}” là:',e:'“{0}” trong tiếng Anh là “{1}”.',d:V3,rev:1},

function qa(r,G,i,used){const gi=ri(r,0,G.length-1),g=G[gi],L=g.d.length;let k=Math.min(L-1,Math.max(0,Math.round((9-i)/9*(L-1)+(r()-.5)*L*.4)));

let it=g.d[k];if(typeof it=='string')it=[it,it];if(g.rev)it=[it[1],it[0]];
const t=it[0],a=it[1],w=[...(it[2]||[])],pool=g.w||g.d.map(x=>typeof x=='string'?x:g.rev?x[0]:x[1]);

return mk(r,g.q.replace('{0}',t),a,w,g.e.replace(/\{0\}/g,t.replace('___',a)).replace(/\{1\}/g,a))}
/* ===== ĐỀ SOẠN TAY THEO NGÀY: 'ngày|lớp|môn':[[đề, đáp án đúng, [3 đáp án sai], lời giải],...] xếp từ khó đến dễ; thiếu câu thì web tự sinh thêm cho đủ 10 ===== */

function build(date,g,sub){const r=R(H(date+'|'+g+'|'+sub)),used=new Set(),Q=(CUR[date+'|'+g+'|'+sub]||[]).map(x=>mk(r,x[0],x[1],x[2],x[3]));

function home(){const T=TD(),days=[...Array(7)].map((_,i)=>ad(T,-i));
let h=`<h1>📚 Bài tập mỗi ngày</h1><div class="seg">${[3,5].map(g=>`<button class="${g==gr?'on':''}" onclick="setGr(${g})">Lớp ${g}</button>`).join('')}</div>
<div class="card dt"><button onclick="mv(-1)">◀</button><div><b>${fd(date)}</b><small>${date==T?'Hôm nay':'Chọn ngày khác bên dưới'}</small><input type="date" value="${date}" ${adult?'':`max="${T}"`} onchange="if(this.value)setD(this.value)"></div><button onclick="mv(1)" ${!adult&&date>=T?'disabled':''}>▶</button></div>`;
SUBS.forEach(([k,n,ic])=>{const r=S.get(key(date,gr,k)),done=r&&r.done,c=r?r.a.filter(x=>x!=null).length:0;
h+=`<div class="card sub"><div class="ic">${ic}</div><div class="gr"><b>${n}</b><small>${done?`Điểm: <b>${r.sc}/10</b>`:c?`Đang làm: ${c}/10 câu`:'Chưa làm · 10 câu'}</small></div><div class="bt"><button class="pr" onclick="openQ('${k}')">${done?'Xem điểm':c?'Làm tiếp':'Làm bài'}</button>${adult?`<button onclick="openP('${k}')">Lời giải</button>`:''}</div></div>`});
h+=`<h2>7 ngày gần đây</h2><div class="card">`+days.map(d=>`<div class="row ${d==date?'cur':''}" onclick="setD('${d}')"><span>${fd(d)}</span><span>${SUBS.map(([k,n,ic])=>{const r=S.get(key(d,gr,k));return`<i class="chip ${r&&r.done?'ok':''}">${ic} ${r&&r.done?r.sc+'/10':'–'}</i>`}).join('')}</span></div>`).join('')+`</div>`;

function quiz(){const{Q,R}=cur,q=Q[qi];

function par(){const{Q,R}=cur;

Q.map((q,i)=>{const a=R.a[i],ok=a===q.a;if(ow&&ok)return'';

function load(k){sub=k;cur={Q:build(date,gr,k),R:S.get(key(date,gr,k))||{a:Array(10).fill(null),done:0}}}
function setGr(g){gr=g;S.set('bt:gr',g);render(1)}
function setD(d){date=!adult&&d>TD()?TD():d;render(1)}
function mv(n){setD(ad(date,n))}
function go(){view='home';render()}
function openQ(k){load(k);if(cur.R.done)view='res';else{view='quiz';qi=Math.max(0,cur.R.a.findIndex(x=>x==null))}warn=0;render()}
function openP(k){if(!adult)return;load(k);ow=0;rs=0;view='par';render()}
function jq(i){qi=i;render()}
function pick(j){cur.R.a[qi]=j;S.set(key(date,gr,sub),cur.R);render(1)}
function submit(){const{Q,R}=cur,n=R.a.filter(x=>x==null).length;
if(n&&!warn){warn=1;flash=`Còn ${n} câu chưa làm. Bấm “Nộp bài” lần nữa để chốt bài.`;return render(1)}
R.sc=Q.filter((q,i)=>R.a[i]===q.a).length;R.done=1;R.t=Date.now();S.set(key(date,gr,sub),R);warn=0;view='res';render()}

if(H('pin|'+v)!==PH){mm='Sai mã PIN.';return render(1)}
adult=true;modal=null;mm='';render(1)}

rs=0;S.set(key(date,gr,sub),null);view='home';render()}
render();
